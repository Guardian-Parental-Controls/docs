name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - "main"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_changed: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Detect docs-related changes
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        with:
          filters: |
            docs:
              - "docs/**"
              - "mkdocs.yml"
              - "requirements-docs.txt"
              - ".github/workflows/docs.yml"

  build:
    needs: changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs_changed == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Build docs (strict)
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict

  deploy:
    needs: changes
    if: |
      github.event_name == 'push' && (
        startsWith(github.ref, 'refs/tags/v') ||
        (github.ref == 'refs/heads/main' && needs.changes.outputs.docs_changed == 'true')
      )
    runs-on: ubuntu-latest
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch gh-pages for mike
        run: git fetch origin gh-pages:gh-pages --force || true

      - name: Deploy dev docs
        if: github.ref == 'refs/heads/main'
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: |
          mike deploy dev --push --update-aliases latest
          mike set-default --push latest

      - name: Deploy release docs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: |
          mike deploy "${GITHUB_REF_NAME}" --push --update-aliases latest
          mike set-default --push latest
